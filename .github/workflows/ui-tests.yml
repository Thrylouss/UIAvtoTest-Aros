name: UI tests (Playwright + Java)

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "maven"

      - name: Install Playwright browsers (Chromium)
        run: mvn -B exec:java@install-browsers

      - name: Run UI tests
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          TEST_USER_PHONE: ${{ secrets.TEST_USER_PHONE }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
          TEST_USER_WRONG_PASSWORD: ${{ secrets.TEST_USER_WRONG_PASSWORD }}
          HEADLESS: "true"
        run: mvn -B test

      - name: Generate Allure report
        if: always()
        uses: simple-elf/allure-report-action@v1.10
        with:
          allure_results: target/allure-results
          allure_report: target/allure-report

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: target/allure-report
          retention-days: 14
