# Конфигурация движка JUnit5 (Jupiter).
#
# Параллельный запуск ВЫКЛЮЧЕН по умолчанию (false) — так проще отлаживать
# тесты, когда вы только знакомитесь с проектом: логи и скриншоты идут
# строго по одному тесту за раз, ничего не перемешивается.
#
# Архитектура проекта УЖЕ готова к параллельному запуску (см. ThreadLocal
# в PlaywrightManager) — когда тестов станет много и захочется ускорить
# прогон, включите его, поменяв строку ниже на:
#   junit.jupiter.execution.parallel.enabled = true
#   junit.jupiter.execution.parallel.mode.default = concurrent
#   junit.jupiter.execution.parallel.mode.classes.default = concurrent
junit.jupiter.execution.parallel.enabled = false

# per_method — новый экземпляр тестового класса на каждый @Test-метод
# (значение по умолчанию в JUnit5, указано здесь явно ради наглядности).
# Благодаря этому тесты в одном классе не делят между собой состояние —
# каждый метод получает чистые поля (в т.ч. чистую страницу браузера).
junit.jupiter.testinstance.lifecycle.default = per_method
