# По умолчанию Allure пишет сырые результаты в папку allure-results/
# прямо в корне проекта — что странно, ведь ВСЕ остальные результаты
# сборки (скомпилированные классы, отчёты surefire) лежат в target/.
# Явно указываем то же самое место, где их и ищет CI (.github/workflows/ui-tests.yml)
# и команда `allure serve` из README.
allure.results.directory=target/allure-results
